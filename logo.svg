<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Gráfico MOB">
  <!-- quatro pétalas nas cores do gráfico (amarelo PBI, vermelho menstruação, verde seca, branco fértil), em tons pastéis -->
  <defs>
    <path id="p" d="M46.5 46.5 L27.5 46.5 A19 19 0 1 1 46.5 27.5 L46.5 46.5 Z"/>
  </defs>
  <g stroke-width="1.2" stroke-linejoin="round">
    <use href="#p" fill="#F6E3A1" stroke="#D9BD62"/>
    <use href="#p" fill="#F3B4B0" stroke="#D98580" transform="translate(100 0) scale(-1 1)"/>
    <use href="#p" fill="#B9DDC4" stroke="#7FB592" transform="translate(0 100) scale(1 -1)"/>
    <use href="#p" fill="#FFFFFF" stroke="#B7ADC0" transform="translate(100 100) scale(-1 -1)"/>
  </g>
  <g fill="#4A3F52">
    <circle cx="40" cy="40" r="2.2"/>
    <circle cx="60" cy="40" r="2.2"/>
    <circle cx="40" cy="60" r="2.2"/>
    <circle cx="60" cy="60" r="2.2"/>
  </g>
</svg>
